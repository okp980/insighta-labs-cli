[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insighta"
version = "0.1.0"
description = "Insighta Labs command-line interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Insighta Labs" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
insighta = "insighta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["insighta"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
